plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // optional integration: compile against mod menu, never bundle or require it
    modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // compileOnly for the TrackedValue field types, runtimeOnly so common's mixins
    // apply at dev launch. the shipped jar uses the bundled copy instead
    compileOnly 'folk.sisby:kaleido-config:0.3.3+1.3.2'
    runtimeOnly 'folk.sisby:kaleido-config:0.3.3+1.3.2'

    // dev-run only: common needs the voicechat api on the launch classpath or the
    // architectury transformer crashes (NoClassDefFoundError). not bundled
    runtimeOnly "de.maxhenkel.voicechat:voicechat-api:2.5.31"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "unstubbedJar")) { transitive = false }

    shadowCommon(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive = false
    }
    shadowCommon("io.netty:netty-resolver-dns:${rootProject.netty_dns_version}") { transitive = false }
    shadowCommon("io.netty:netty-codec-dns:${rootProject.netty_dns_version}") { transitive = false }
    include 'folk.sisby:kaleido-config:0.3.3+1.3.2'
    shadowCommon("link.e4mc:iroh-java:${rootProject.iroh_java_version}") {
        transitive = false
    }
    shadowCommon("dev.dirs:directories:${rootProject.dirs_version}")
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"

    relocate "dev.dirs", "link.e4mc.shadow.dirs"
}

remapJar {
    enabled = true
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").unstubbedSourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.register('patchFmj', Jar) {
    archiveClassifier = 'dev-shadow-modern'
    def modVersion = project.version

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(file("src/main/resources-modern"), zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.register("modernRemapJar", net.fabricmc.loom.task.RemapJarTask) {
    injectAccessWidener = true
    input.set patchFmj.archiveFile
    dependsOn patchFmj
    archiveClassifier = "modern"
    sourceNamespace = "intermediary"
    targetNamespace = "named"
}

assemble.dependsOn(modernRemapJar)

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
            artifact modernRemapJar
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        maven {
            url = "https://sg.storage.bunnycdn.com/skyeven"
            credentials(HttpHeaderCredentials) {
                name = "AccessKey"
                value = findProperty("skyevenToken") ?: ""
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    type = STABLE
    changelog = rootProject.ext.getLatestChangelog()
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    version = project.version + "-fabric"
    displayName = "[Fabric] $project.version"

    // Uncomment your desired platform(s)
    curseforge {
        accessToken = project.findProperty("curseforgeApiToken") ?: ""
        projectId = project.findProperty("curseforgeId") ?: ""
        minecraftVersions.addAll(
                "1.18", "1.18.1", "1.18.2",
                "1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4",
                "1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6",
                "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"
        )

        requires {
            slug = "fabric-api"
        }

        optional {
            slug = "mcqoy"
        }
    }

    modrinth {
        accessToken = project.findProperty("modrinthApiToken") ?: ""
        projectId = project.findProperty("modrinthId") ?: ""
        additionalFiles.from(sourcesJar.archiveFile)
        minecraftVersions.addAll(
                "1.18", "1.18.1", "1.18.2",
                "1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4",
                "1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6",
                "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"
        )

        requires {
            slug = "fabric-api"
        }

        optional {
            slug = "mcqoy"
        }
    }

    curseforge("curseforgeModern") {
        accessToken = project.findProperty("curseforgeApiToken") ?: ""
        projectId = project.findProperty("curseforgeId") ?: ""
        version = project.version + "-fabric-modern"
        minecraftVersions.addAll(
                "26.1", "26.2", "26.3-snapshot-9"
        )

        requires {
            slug = "fabric-api"
        }

        optional {
            slug = "mcqoy"
        }
    }

    modrinth("modrinthModern") {
        accessToken = project.findProperty("modrinthApiToken") ?: ""
        projectId = project.findProperty("modrinthId") ?: ""
        file = modernRemapJar.archiveFile
        version = project.version + "-fabric-modern"
        minecraftVersions.addAll(
                "26.1", "26.2", "26.3-snapshot-9"
        )

        requires {
            slug = "fabric-api"
        }

        optional {
            slug = "mcqoy"
        }
    }
}