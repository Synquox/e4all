plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

architectury {
    platformSetupLoomIde()
    forge()
}

def mcFloorVersion = (rootProject.findProperty("forge_minecraft_version") ?: rootProject.minecraft_version).toString()
if (mcFloorVersion.tokenize(".")[0].toInteger() >= 26) {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

loom {
    forge {
        mixinConfig "e4all.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    shadowCommon(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive = false
    }
    include('folk.sisby:kaleido-config:0.3.3+1.3.2')
    shadowCommon("link.e4mc:iroh-java:${rootProject.iroh_java_version}") {
        transitive = false
    }
    shadowCommon("dev.dirs:directories:${rootProject.dirs_version}")

    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.4"))
}

processResources {
    def modVersion = project.version
    def mcRange = rootProject.forge_minecraft_range
    inputs.property "version", modVersion
    inputs.property "minecraftRange", mcRange

    filesMatching("META-INF/mods.toml") {
        expand "version": modVersion, "minecraftRange": mcRange
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "META-INF/maven/**"
    exclude "META-INF/native-image/**"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"

    relocate "dev.dirs", "link.e4mc.shadow.dirs"
}

if (tasks.findByName("remapJar") != null) {
    tasks.named("remapJar").configure {
        input.set shadowJar.archiveFile
        dependsOn shadowJar
    }
} else {
    tasks.named("jar").configure {
        archiveClassifier = "dev"
    }
    shadowJar {
        archiveClassifier = ""
        dependsOn tasks.jar
        from zipTree(tasks.jar.archiveFile)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    tasks.named("assemble").configure {
        dependsOn shadowJar
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}



