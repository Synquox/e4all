plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    // bundle android natives and netty dns into the -android jar variant
    tasks.matching { it.name == "build" }.configureEach {
        finalizedBy "packageAndroidNatives"
    }

    tasks.register("packageAndroidNatives") {
        group = "build"
        description = "Removes Android Bionic natives and netty dns classes from release jars and produces -android variants with them bundled."
        def projectName = project.name
        def libsDir = project.layout.buildDirectory.dir("libs").get().asFile
        doLast {
            // The common project's jars are Loom intermediates consumed by the platform
            // builds - never touch them.
            if (projectName == "common") return
            if (!libsDir.isDirectory()) return
            def nativesRoot = rootProject.file("common/src/main/resources/assets/e4all/natives")
            def releaseJars = libsDir.listFiles().findAll { it.name.endsWith(".jar") &&
                    !(it.name ==~ /.*(dev|sources|shadow|slim|android).*\.jar/) }
            // entries that are only ever needed on Android: Bionic natives + netty dns
            def androidOnlyPrefixes = ["assets/e4all/natives/android-", "io/netty/resolver/dns/", "io/netty/handler/codec/dns/"]
            def newestNative = 0L
            nativesRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                newestNative = Math.max(newestNative, f.lastModified())
            }
            def hasAndroidOnlyEntries = { File f ->
                def zf = new java.util.zip.ZipFile(f)
                try {
                    def entries = zf.entries()
                    while (entries.hasMoreElements()) {
                        def name = entries.nextElement().name
                        if (androidOnlyPrefixes.any { name.startsWith(it) }) return true
                    }
                    return false
                } finally {
                    zf.close()
                }
            }
            releaseJars.each { jar ->
                def base = jar.name[0..-5]
                def androidJar = new File(libsDir, base + "-android.jar")
                def tmp = new File(libsDir, base + ".tmp.jar")
                def tmpAndroid = new File(libsDir, base + ".tmp-android.jar")

                // Skip jars that were already processed: the release jar carries none of
                // the android-only entries and the -android variant is newer than both
                // the jar and the natives on disk.
                if (!hasAndroidOnlyEntries(jar) && androidJar.exists() &&
                        androidJar.lastModified() >= jar.lastModified() &&
                        androidJar.lastModified() >= newestNative) {
                    println("e4all: skipping " + jar.name + " (already slim, -android variant up to date)")
                    return
                }

                // Release jar: repack without the Android-only entries (no-op if already slim).
                def zin = new java.util.zip.ZipFile(jar)
                def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
                // -android variant: keeps everything except the Android natives (so the
                // netty dns classes stay in), plus only aarch64 natives
                // (x86_64 Android is emulator-only; those stay in the repo resources)
                def aout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmpAndroid))
                zin.entries().each { entry ->
                    if (!entry.name.startsWith("assets/e4all/natives/android-")) {
                        aout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (!entry.isDirectory()) {
                            zin.getInputStream(entry).withCloseable { aout << it }
                        }
                        aout.closeEntry()
                    }
                    def androidOnlyEntry = entry.name.startsWith("assets/e4all/natives/android-") ||
                            androidOnlyPrefixes.any { entry.name.startsWith(it) }
                    if (!androidOnlyEntry) {
                        zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (!entry.isDirectory()) {
                            zin.getInputStream(entry).withCloseable { zout << it }
                        }
                        zout.closeEntry()
                    }
                }
                nativesRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    def rel = "assets/e4all/natives/" + nativesRoot.toPath().relativize(f.toPath()).toString().replace("\\", "/")
                    if (rel.contains("/android-aarch64/")) {
                        aout.putNextEntry(new java.util.zip.ZipEntry(rel))
                        f.withInputStream { aout << it }
                        aout.closeEntry()
                    }
                }
                zin.close()
                zout.close()
                aout.close()
                java.nio.file.Files.move(tmp.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                java.nio.file.Files.move(new File(libsDir, base + ".tmp-android.jar").toPath(), androidJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println("e4all: slimmed " + jar.name + "; produced " + androidJar.name + " (natives + dns bundled)")
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.officialMojangMappings()
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:1.18.2+build.4:v2"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name + "-" + project.name
    }

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenLocal()
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        flatDir {
            dirs("../libs")
        }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = 'https://repo.sleeping.town/' }
        maven { url = 'https://maven.is-quite.gay/' }
        maven { url = "https://maven.maxhenkel.de/repository/public" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

ext.getLatestChangelog = {
    Collection<String> lines = file("$rootDir/CHANGELOG.md").readLines()
    String changelog = ""
    Boolean atSegment = false
    for (String line : lines) {
        if (line.startsWith("## ")) {
            if (atSegment) break // hit next segment
            atSegment = true
        }
        if (atSegment) changelog += "$line\n"
    }
    return changelog.trim()
}

tasks.register("viewLatestChangelog") {
    group = "documentation"
    description "Print the topmost single version section from the full CHANGELOG.md file."
    doLast {
        println(getLatestChangelog())
    }
}